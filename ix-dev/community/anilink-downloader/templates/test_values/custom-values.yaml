resources:
  limits:
    cpus: 1.0
    memory: 1024

anilink:
  debrid_api_key: test-api-key
  debrid_request_delay: 1000
  concurrent_downloads: 2
  archive_passwords:
    - first-password
    - second-password
    - "third password"
  additional_envs:
    - name: Logging__LogLevel__Default
      value: Debug

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 9090

run_as:
  user: 1000
  group: 1000

ix_volumes:
  downloads: /opt/tests/mnt/anilink-downloader/downloads

storage:
  downloads:
    type: ix_volume
    ix_volume_config:
      dataset_name: downloads
      create_host_path: true
  additional_storage:
    - type: anonymous
      mount_path: /scratchpad
      volume_config:
        nocopy: true
