resources:
  limits:
    cpus: 2.0
    memory: 2048

anilink:
  debrid_api_key: test-api-key
  debrid_request_delay: 500
  concurrent_downloads: 3
  archive_passwords: []
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

storage:
  downloads:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/anilink-downloader/downloads
      create_host_path: true
  additional_storage: []
